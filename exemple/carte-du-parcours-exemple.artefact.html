<style>
/* Plan : un schéma large pour l'ordinateur (environ 1440 x 760). Le parcours en ruban cliquable, comme une ligne de métro
   dont chaque étape est une station ; les pages en cartes par étape ; la fiche de la page choisie à droite.
   Tout est dans ce fichier : aucun script ni style externe ; les données sont dans le bloc JSON (id « donnees »), juste au-dessus. */
:root {
  /* Couleurs, clair. Chaque paire texte/fond est mesurée par scripts/contrastes.py. */
  --fond: #F3F6F7; --surface: #FFFFFF; --teinte: #E3EEF1; --surligne: #D8EAF0;
  --texte: #12232B; --texte-2: #41535B; --marque: #0A4D5C; --bord: #667880; --filet: #D2DBDF;
  --action: #0A6280; --sur-action: #FFFFFF; --focus: #1D4FD7;
  --attention: #7A4300; --alerte-fond: #FFEFD0;
  --erreur: #8C1D12; --erreur-fond: #FCE8E4;
  /* Polices : celles du système, pour que le fichier reste seul et hors ligne. */
  --police-titres: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --police-texte: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --police-code: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --haut-ruban: 76px;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #0D1A20; --surface: #14262E; --teinte: #1B343E; --surligne: #1F3E4B;
    --texte: #E9F0F3; --texte-2: #B3C3CA; --marque: #8CD0E0; --bord: #7D929C; --filet: #2A414B;
    --action: #7FCBE2; --sur-action: #0D1A20; --focus: #F5C86A;
    --attention: #F4C77C; --alerte-fond: #35240F;
    --erreur: #FFB4A8; --erreur-fond: #3A1B17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fond: #0D1A20; --surface: #14262E; --teinte: #1B343E; --surligne: #1F3E4B;
  --texte: #E9F0F3; --texte-2: #B3C3CA; --marque: #8CD0E0; --bord: #7D929C; --filet: #2A414B;
  --action: #7FCBE2; --sur-action: #0D1A20; --focus: #F5C86A;
  --attention: #F4C77C; --alerte-fond: #35240F;
  --erreur: #FFB4A8; --erreur-fond: #3A1B17;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--haut-ruban) + 8px); }
body { margin: 0; background: var(--fond); color: var(--texte); font: 400 16px/1.45 var(--police-texte); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--fond); }
[hidden]:not([hidden=until-found i]) { display: none !important; }
.page { max-width: 1760px; margin: 0 auto; padding-block: 20px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }

<script>

/* ---------- En-tête ---------- */
$("#titre").textContent = META.titre;

const ruban = $("#ruban");
for (const e of ETAPES.filter(x => !x.espace)) {
  const pages = TOUTES.filter(p => p.etape === e.id);
  if (!pages.length) continue;
  const nd = pages.filter(estDouble).length;
  const b = el("button", { type: "button", class: "puce" + (e.numero ? "" : " sans-num"), "aria-current": "false" });
  if (e.numero) b.append(el("span", { class: "num", "aria-hidden": "true", text: e.numero }));
  const txt = el("span", { class: "txt" });
  txt.append(el("b", { text: (e.numero ? e.numero + ". " : "") + (e.court || e.nom) }));
  const s = el("small"); s.append(document.createTextNode(plur(pages.length, "page", "pages")));
  if (nd) s.append(document.createTextNode(", "), el("span", { class: "dbl", text: plur(nd, "doublon", "doublons") }));
  txt.append(s); b.append(txt);
  b.addEventListener("click", () => {
    const cible = document.getElementById("etape-" + e.id);
    if (!cible) return;
    cible.scrollIntoView({ block: "start" });
    cible.querySelector("h2").focus({ preventScroll: true });
    ruban.querySelectorAll(".puce").forEach(x => x.setAttribute("aria-current", x === b ? "true" : "false"));
  });
  ruban.append(el("li", {}, b));
}

/* ---------- La fiche ---------- */
function etiquetteDe(p) { const e = ETAPE[p.etape]; if (e.espace) { const n = ESPACES.find(x => x.id === e.espace).nom; return n === e.nom ? n : n + " · " + e.nom; } return libelleEtape(p.etape); }
function lienPage(id) {
  const p = PAGE[id];
  const b = el("button", { type: "button", class: "lien", "data-aller": id });
  const g = el("span"); g.append(document.createTextNode(p.nom));
  if (estDouble(p)) g.append(el("span", { class: "badge double", text: "double" }));
  if (p.orpheline) g.append(el("span", { class: "badge orpheline", text: "orpheline" }));
  if (p.absente) g.append(el("span", { class: "badge absente", text: "à construire" }));
  b.append(g, el("small", { text: courtEtape(p.etape) }));
  b.addEventListener("click", () => choisir(id, { focus: true }));
  return b;
}
function listeLiens(ids, vide) {
  if (!ids.length) return el("p", { class: "aucun", text: vide });
  const ul = el("ul", { class: "liste-liens" });
  for (const i of ids) ul.append(el("li", {}, lienPage(i)));
  return ul;
}
function dateFr(iso) {
  const d = new Date(iso + "T12:00:00");
  return isNaN(d) ? iso : d.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
}
function ficheAccueil() {
  fiche.replaceChildren();
  fiche.removeAttribute("role"); fiche.removeAttribute("aria-modal"); fiche.removeAttribute("aria-labelledby");
  const doubles = PRINCIPALES.filter(estDouble), orphelines = PRINCIPALES.filter(p => p.orpheline), absentes = PRINCIPALES.filter(p => p.absente);
  fiche.append(el("h2", { text: "Choisissez une page" }));
  fiche.append(el("p", { text: "Chaque fiche dit à quoi sert la page, d’où l’on y arrive et où l’on peut aller. Les flèches du schéma relient la page choisie à ses voisines." }));
  if (META.etat_au) fiche.append(el("p", { class: "info", text: "État au " + dateFr(META.etat_au) + "." }));
  if (META.perimetre) fiche.append(el("p", { class: "info", text: META.perimetre }));
  if ((META.hypotheses || []).length) {
    fiche.append(el("h3", { text: "Hypothèses, à valider" }));
    const hl = el("ul", { class: "hypotheses" });
    for (const h of META.hypotheses) hl.append(el("li", { text: h }));
    fiche.append(hl);
  }
  const ul = el("ul", { class: "chiffres" });
  const nombres = [[PRINCIPALES.length, "pages côté " + META.role], [doubles.length, "en double"], [(D.doublons || []).length, "groupes de doublons"]];
  if (orphelines.length) nombres.push([orphelines.length, orphelines.length > 1 ? "orphelines" : "orpheline"]);
  if (CONSTATS.length) nombres.push([CONSTATS.length, CONSTATS.length > 1 ? "constats" : "constat"]);
  for (const [n, t] of nombres) { const li = el("li"); li.append(el("b", { text: String(n) }), el("span", { text: t })); ul.append(li); }
  fiche.append(ul);
  const replies = ESPACES.map(esp => [esp, TOUTES.filter(p => (ETAPE[p.etape].espace || "") === esp.id).length]).filter(x => x[1] > 0);
  if (replies.length) fiche.append(el("p", { class: "info", text: "Replié en bas de la page : " + replies.map(([esp, n]) => esp.nom + " (" + plur(n, "page", "pages") + ")").join(", ") + "." }));
  if (CONSTATS.length) {
    fiche.append(el("h3", { text: "Constats (" + CONSTATS.length + ")" }));
    for (const c of CONSTATS) {
      const b = el("div", { class: "constat" });
      b.append(el("strong", { text: c.titre }), el("p", { text: c.texte }));
      if ((c.pages || []).length) b.append(listeLiens(c.pages, ""));
      fiche.append(b);
    }
  }
  fiche.append(el("h3", { text: "Comment lire la carte" }));
  const lg = el("ul", { class: "legende" });
  const l = (cls, txt) => { const li = el("li"); li.append(el("span", { class: "pastille " + cls, "aria-hidden": "true" }), el("span", { text: txt })); return li; };
  lg.append(l("", "Une page de l’application."));
  lg.append(l("d", "Un doublon : la page fait la même chose qu’une autre. Sa fiche montre l’autre."));
  lg.append(l("v", "Page d’où l’on arrive : bordure en pointillé et flèche en pointillé."));
  lg.append(l("a", "Page où l’on peut aller : bordure pleine et flèche pleine."));
  if (orphelines.length) lg.append(l("o", "Page orpheline : aucun lien n’y mène."));
  if (absentes.length) lg.append(l("x", "Page à construire : décidée, pas encore faite."));
  if (ETAPES.some(e => !e.numero && !e.espace)) lg.append(l("t", "Étape en pointillé dans le ruban : on peut y aller à tout moment."));
  fiche.append(lg);
  let depart = (META.pour_commencer || []).filter(i => PAGE[i]);
  if (!depart.length) depart = (doubles.length ? doubles : PRINCIPALES).slice(0, 3).map(p => p.id);
  if (depart.length) { fiche.append(el("h3", { text: "Pour commencer" }), listeLiens(depart, "")); }
}
function ficheDe(id, pleinEcran) {
  const p = PAGE[id];
  fiche.replaceChildren();
  const precedente = etat.pile.length > 1 ? PAGE[etat.pile[etat.pile.length - 2]] : null;
  if (precedente || pleinEcran) {
    const retour = el("button", { type: "button", class: "retour", text: precedente ? "‹ Retour à « " + precedente.nom + " »" : "‹ Retour à la carte" });
    retour.addEventListener("click", () => { if (precedente) history.back(); else fermer(); });
    fiche.append(retour);
  }
  fiche.append(el("p", { class: "etiquette", text: etiquetteDe(p) }));
  fiche.append(el("h2", { id: "fiche-titre", tabindex: "-1", text: p.nom }));
  fiche.append(el("p", { class: "fonction", text: p.fonction }));
  if (p.adresse) fiche.append(el("p", { class: "adresse" }, el("code", { text: p.adresse })));
  if (p.actions) fiche.append(el("p", { class: "actions-n" }, document.createTextNode("Actions sur la page : "), el("b", { text: p.actions })));
  if (p.orpheline) {
    const b = el("div", { class: "boite orpheline" });
    b.append(el("strong", { text: "Page orpheline" }), el("p", { text: "Aucun lien ne mène à cette page dans l’application." }));
    fiche.append(b);
  }
  if (p.absente) fiche.append(el("p", { class: "note", text: "Page à construire : elle est décidée mais n’existe pas encore." }));
  for (const g of p.groupes) {
    const b = el("div", { class: "boite" });
    b.append(el("strong", { text: "Doublon : " + g.titre }));
    if (TYPES_DOUBLON[g.type]) b.append(el("p", { class: "type", text: TYPES_DOUBLON[g.type] }));
    if (g.pourquoi) b.append(el("p", { text: g.pourquoi }));
    const autres = g.pages.filter(i => i !== id);
    b.append(el("p", { text: "Fait la même chose que :" }), listeLiens(autres, ""));
    if (g.piste) b.append(el("p", { text: "Piste : " + g.piste }));
    fiche.append(b);
  }
  if (p.note) fiche.append(el("p", { class: "note", text: p.note }));
  if (p.parent) fiche.append(el("h3", { text: "Sous-page de" }), listeLiens([p.parent], ""));
  if (p.enfants.length) fiche.append(el("h3", { text: "Sous-pages (" + p.enfants.length + ")" }), listeLiens(p.enfants, ""));
  const arrivees = p.vient.filter(i => i !== p.parent);
  fiche.append(el("h3", { text: "D’où l’on arrive (" + arrivees.length + ")" }), listeLiens(arrivees, p.entree ? "Page d’entrée : on y arrive par une adresse, un lien extérieur ou le menu." : "Aucun lien ne mène ici."));
  const suites = p.vers.filter(i => !p.enfants.includes(i));
  fiche.append(el("h3", { text: "Où l’on peut aller (" + suites.length + ")" }), listeLiens(suites, "Aucune suite : la page est un point d’arrivée."));
  if (pleinEcran) { fiche.setAttribute("role", "dialog"); fiche.setAttribute("aria-modal", "true"); fiche.setAttribute("aria-labelledby", "fiche-titre"); }
  else { fiche.removeAttribute("role"); fiche.removeAttribute("aria-modal"); fiche.removeAttribute("aria-labelledby"); }
}

/* ---------- Sélection, flèches, filtres ---------- */
function marquer() {
  for (const [id, b] of Object.entries(cartes)) {
    b.classList.remove("vient", "va", "groupe"); b.querySelectorAll(".tag").forEach(t => t.remove());
    b.setAttribute("aria-pressed", id === etat.choisi ? "true" : "false");
  }
  if (!etat.choisi) return;
  const p = PAGE[etat.choisi];
  const les2 = new Set(p.vient.filter(i => p.vers.includes(i)));
  for (const i of p.vient) if (cartes[i] && !les2.has(i)) { cartes[i].classList.add("vient"); cartes[i].append(el("span", { class: "tag", text: "d’où" })); }
  for (const i of p.vers) if (cartes[i]) { cartes[i].classList.add("va"); cartes[i].append(el("span", { class: "tag", text: les2.has(i) ? "d’où et vers" : "vers" })); }
  for (const g of p.groupes) for (const i of g.pages) if (i !== etat.choisi && cartes[i]) {
    cartes[i].classList.add("groupe");
    if (!cartes[i].querySelector(".tag.meme")) cartes[i].append(el("span", { class: "tag meme" + (cartes[i].querySelector(".tag") ? " bas" : ""), text: "même fonction" }));
  }
}
const NS = "http://www.w3.org/2000/svg";
function tracer() {
  for (const svg of document.querySelectorAll(".liens-svg")) svg.replaceChildren();
  if (!etat.choisi || etroit()) return;
  const source = cartes[etat.choisi];
  const conteneur = source.closest(".schema");
  const svg = conteneur.querySelector(".liens-svg");
  if (!conteneur.offsetParent || source.closest("details:not([open])") || source.closest("li").hidden) return;
  const cr = conteneur.getBoundingClientRect();
  const defs = document.createElementNS(NS, "defs");
  for (const nom of ["suiv", "vient"]) {
    const m = document.createElementNS(NS, "marker");
    m.setAttribute("id", "pointe-" + nom); m.setAttribute("viewBox", "0 0 10 10"); m.setAttribute("refX", "9"); m.setAttribute("refY", "5");
    m.setAttribute("markerWidth", "7"); m.setAttribute("markerHeight", "7"); m.setAttribute("orient", "auto-start-reverse");
    const t = document.createElementNS(NS, "path"); t.setAttribute("d", "M0,0 L10,5 L0,10 z"); t.setAttribute("class", "pointe " + nom); m.append(t); defs.append(m);
  }
  svg.append(defs);
  const boite = e => { const r = e.getBoundingClientRect(); return { x: r.left - cr.left, y: r.top - cr.top, w: r.width, h: r.height }; };
  const relier = (de, vers, classe) => {
    const a = boite(de), b = boite(vers);
    let x1, y1, x2, y2, c1x, c1y, c2x, c2y;
    if (Math.abs((a.y + a.h / 2) - (b.y + b.h / 2)) < a.h * 0.6) {   /* même ligne */
      const droite = b.x > a.x;
      const ecart = droite ? b.x - (a.x + a.w) : a.x - (b.x + b.w);
      if (ecart < 40) {   /* voisines : un trait droit, bord à bord */
        x1 = droite ? a.x + a.w : a.x; x2 = droite ? b.x : b.x + b.w; y1 = a.y + a.h / 2; y2 = b.y + b.h / 2;
        c1x = x1 + (x2 - x1) / 3; c1y = y1; c2x = x1 + 2 * (x2 - x1) / 3; c2y = y2;
      } else {   /* éloignées : un pont dans l'espace entre deux lignes, pour ne pas barrer le texte des cartes */
        x1 = a.x + a.w * 0.28; y1 = a.y; x2 = b.x + b.w * 0.28; y2 = b.y;   /* à 28 % : loin de l'étiquette en haut à droite */
        c1x = x1; c1y = y1 - 15; c2x = x2; c2y = y2 - 15;
      }
    } else {
      const bas = b.y > a.y;
      x1 = a.x + a.w * (bas ? 0.5 : 0.28); y1 = bas ? a.y + a.h : a.y; x2 = b.x + b.w * (bas ? 0.28 : 0.5); y2 = bas ? b.y : b.y + b.h;
      const dy = Math.max(30, Math.abs(y2 - y1) / 2) * (bas ? 1 : -1);
      c1x = x1; c1y = y1 + dy; c2x = x2; c2y = y2 - dy;
    }
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", "M" + x1 + "," + y1 + " C" + c1x + "," + c1y + " " + c2x + "," + c2y + " " + x2 + "," + y2);
    path.setAttribute("class", "fl " + classe);
    path.setAttribute("marker-end", "url(#pointe-" + classe + ")");
    svg.append(path);
  };
  const p = PAGE[etat.choisi];
  const visible = c => c && c !== source && c.closest(".schema") === conteneur && !c.closest("li").hidden;
  for (const i of p.vers) if (visible(cartes[i])) relier(source, cartes[i], "suiv");
  for (const i of p.vient) if (visible(cartes[i])) relier(cartes[i], source, "vient");
}
function dansLaVue(c) {
  const r = c.getBoundingClientRect();
  const haut = $("#ruban-nav").getBoundingClientRect().bottom + 8;
  return r.top >= haut && r.bottom <= innerHeight - 8;
}
function ouvrirFeuille(ouverte) {
  document.body.classList.toggle("fiche-ouverte", ouverte);
  for (const id of ["tete", "etat", "ruban-nav", "cote-schema"]) { const e = document.getElementById(id); if (ouverte && etroit()) e.setAttribute("inert", ""); else e.removeAttribute("inert"); }
}
function choisir(id, opts) {
  opts = opts || {};
  if (!PAGE[id]) return;
  if (id === etat.choisi && !opts.depuisAdresse && !etroit() && !opts.focus) { fermer(); return; }
  etat.choisi = id;
  if (opts.declencheur) etat.declencheur = opts.declencheur;
  if (!opts.depuisAdresse) {
    if (etat.pile[etat.pile.length - 1] !== id) etat.pile.push(id);
    if (location.hash !== "#p-" + id) location.hash = "p-" + id;
  }
  const p = PAGE[id];
  const esp = espaceDe(p);
  if (esp) { const d = document.getElementById("espace-" + esp); if (d) d.open = true; }
  if (cartes[id] && cartes[id].closest("li").hidden) { etat.q = ""; $("#q").value = ""; etat.doublons = false; $("#dbl").setAttribute("aria-pressed", "false"); filtrer(); }
  const pleinEcran = etroit();
  ficheDe(id, pleinEcran); marquer();
  ouvrirFeuille(true);
  if (cartes[id] && !pleinEcran && !dansLaVue(cartes[id])) cartes[id].scrollIntoView({ block: "center", inline: "nearest" });
  requestAnimationFrame(tracer);
  fiche.scrollTop = 0;
  if (opts.focus || pleinEcran) $("#fiche-titre").focus({ preventScroll: true });
}
function fermer() {
  const retour = etat.declencheur;
  etat.choisi = null; etat.pile = [];
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  ouvrirFeuille(false);
  ficheAccueil(); marquer(); tracer();
  if (retour && document.contains(retour)) retour.focus({ preventScroll: true });
}
function filtrer() {
  const q = sansAccent(etat.q.trim());
  let n = 0;
  for (const p of TOUTES) {
    const c = cartes[p.id]; if (!c) continue;
    const ok = (!q || sansAccent(p.nom + " " + p.fonction + " " + p.adresse + " " + p.note).includes(q)) && (!etat.doublons || estDouble(p));
    c.closest("li").hidden = !ok;
    if (ok) n++;
  }
  for (const sec of document.querySelectorAll(".etape")) sec.hidden = !sec.querySelector("li:not([hidden])");
  const filtre = q || etat.doublons;
  for (const det of document.querySelectorAll(".espace")) {
    const a = !!det.querySelector("li:not([hidden])");
    det.hidden = !a;
    if (filtre) { if (det.dataset.avant === undefined) det.dataset.avant = det.open ? "1" : "0"; if (a) det.open = true; }
    else if (det.dataset.avant !== undefined) { det.open = det.dataset.avant === "1"; delete det.dataset.avant; }
  }
  $("#vide").hidden = !(filtre && n === 0);
  $("#etat").textContent = filtre
    ? (n === 0 ? "Aucune page" : plur(n, "page", "pages")) + " sur " + TOUTES.length + (etat.doublons ? ", en double" : "") + (q ? ", pour « " + etat.q.trim() + " »" : "") + "."
    : "";
  tracer();
}
$("#q").addEventListener("input", e => { etat.q = e.target.value; filtrer(); });
$("#dbl").addEventListener("click", e => { etat.doublons = !etat.doublons; e.currentTarget.setAttribute("aria-pressed", String(etat.doublons)); filtrer(); });

/* ---------- Thème : suit le système, un bouton force clair ou sombre ---------- */
const racine = document.documentElement;
const sombreActuel = () => racine.getAttribute("data-theme") === "dark" || (!racine.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
function libelleTheme() { const b = $("#theme"); const s = sombreActuel(); b.textContent = s ? "Thème clair" : "Thème sombre"; }
$("#theme").addEventListener("click", () => { racine.setAttribute("data-theme", sombreActuel() ? "light" : "dark"); libelleTheme(); requestAnimationFrame(tracer); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", libelleTheme);
new MutationObserver(libelleTheme).observe(racine, { attributes: true, attributeFilter: ["data-theme"] });
libelleTheme();

/* ---------- Mesures, navigation, départ ---------- */
function mesurerRuban() { racine.style.setProperty("--haut-ruban", Math.ceil($("#ruban-nav").getBoundingClientRect().height) + "px"); }
let etaitEtroit = etroit();
addEventListener("resize", () => {
  mesurerRuban();
  if (etroit() !== etaitEtroit) { etaitEtroit = etroit(); if (etat.choisi) { ficheDe(etat.choisi, etaitEtroit); ouvrirFeuille(true); } }
  requestAnimationFrame(tracer);
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { mesurerRuban(); requestAnimationFrame(tracer); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && etat.choisi) fermer(); });
addEventListener("hashchange", () => {
  const m = /^#p-([a-z0-9-]+)$/.exec(location.hash);
  if (m && PAGE[m[1]]) {
    const id = m[1];
    if (etat.pile.length > 1 && etat.pile[etat.pile.length - 2] === id) etat.pile.pop();
    else if (etat.pile[etat.pile.length - 1] !== id) etat.pile.push(id);
    choisir(id, { depuisAdresse: true, focus: true });
  } else if (!location.hash && etat.choisi) { etat.choisi = null; etat.pile = []; ouvrirFeuille(false); ficheAccueil(); marquer(); tracer(); }
});
mesurerRuban(); ficheAccueil(); filtrer();
{
  const m = /^#p-([a-z0-9-]+)$/.exec(location.hash);
  if (m && PAGE[m[1]]) { etat.pile = [m[1]]; choisir(m[1], { depuisAdresse: true }); }
}
})();
</script>
